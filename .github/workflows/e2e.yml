name: e2e

on:
    workflow_dispatch:
    pull_request:
        branches: [ main ]

permissions:
    contents: read

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            GCLOUD_PROJECT: demo-local
        steps:
            - name: Skip release bump e2e
              if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'automation:release-bump')
              run: echo "Release bump PR only changes package versions; release-policy validates it."
            - uses: actions/checkout@v6
              if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'automation:release-bump')
            - uses: pnpm/action-setup@v5
              if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'automation:release-bump')
            - uses: actions/setup-node@v6
              if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'automation:release-bump')
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/setup-java@v5
              if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'automation:release-bump')
              with:
                  distribution: temurin
                  java-version: 21
            - if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'automation:release-bump')
              run: pnpm install --frozen-lockfile
            - name: Install Electron runtime deps
              if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'automation:release-bump')
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64
            - if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'automation:release-bump')
              run: pnpm build
            - if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'automation:release-bump')
              run: pnpm --filter @firebase-desk/e2e exec playwright install --with-deps
                  chromium
            - if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'automation:release-bump')
              run: xvfb-run --auto-servernum -- pnpm dlx firebase-tools@15.15.0 --project
                  demo-local emulators:exec --only auth,firestore --config
                  firebase/emulator/firebase.json "pnpm --filter
                  @firebase-desk/emulator-tools seed && pnpm --filter
                  @firebase-desk/e2e test:e2e"
            - if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  if-no-files-found: ignore
                  path: |
                      e2e/playwright-report
                      e2e/test-results
                      e2e/firestore-debug.log
                      e2e/firebase-debug.log
                      e2e/ui-debug.log
                      firestore-debug.log
                      firebase-debug.log
                      ui-debug.log
                  retention-days: 7
